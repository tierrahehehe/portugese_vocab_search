<html lang="ja">
<head>
<meta charset="utf-8">

<title>ポルトガル語・既習単語検索</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#202124;background:#f5f7fb}
*{box-sizing:border-box}
body{margin:0;padding:24px 14px}
main{max-width:760px;margin:0 auto}
.card{background:#fff;border:1px solid #e3e7ef;border-radius:16px;padding:24px;box-shadow:0 5px 22px #18233a0b}
h1{font-size:1.45rem;margin:0 0 8px}
p{color:#596273;line-height:1.65}
label{display:block;font-weight:650;margin:18px 0 7px}
input{width:100%;font-size:1.05rem;padding:13px 14px;border:1px solid #cbd2df;border-radius:10px;outline:none}
input:focus{border-color:#4778d0;box-shadow:0 0 0 3px #4778d022}
button{border:0;border-radius:10px;padding:11px 17px;font-size:.98rem;font-weight:650;cursor:pointer}
.primary{background:#245fc5;color:white}
.secondary{background:#edf1f7;color:#263247}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
#gate{max-width:420px;margin:10vh auto}
#app{display:none}
#status{margin:18px 0 10px;font-weight:700}
#results{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f8fb;border:1px solid #e5e9f0;border-radius:10px;padding:14px;max-height:52vh;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:.92rem;line-height:1.55}
.hint{font-size:.88rem;color:#687386}

</style>
</head>
<body>
<main>
<section id="gate" class="card">
<h1>入場キーを入力</h1>
<p>利用するには入場キーが必要です。</p>
<label for="key">入場キー</label>
<input id="key" type="password" inputmode="numeric" autocomplete="off" placeholder="入場キー">
<div class="actions"><button class="primary" id="enter">入場</button></div>
<p id="gateError" class="hint" aria-live="polite"></p>
</section>

<section id="app" class="card">
<h1>ポルトガル語・既習単語検索</h1>
<p>本を読んでいて出会った単語を入力すると、既習単語リストに含まれているか検索します。</p>
<label for="word">調べたいポルトガル語</label>
<input id="word" type="search" autocomplete="off" placeholder="例：abandonar">
<div class="actions">
<button class="primary" id="search">検索</button>
<button class="secondary" id="clear">クリア</button>
</div>
<div id="status" aria-live="polite">単語を入力してください。</div>
<div id="results" aria-live="polite">検索結果がここに表示されます。</div>
<p class="hint">Enter または Ctrl + F で検索欄に移動できます。アクセント記号・大文字小文字の違いは無視して検索します（例：ação / acao、avô / avo）。</p>
<div class="actions"><button class="secondary" id="toggleList">リストをすべて表示</button></div>
<div id="allList"><pre id="listText"></pre></div>
<footer>検索対象：アップロードされた por6000txt.txt（テキスト全体）</footer>
</section>
</main>

const normalize = s => s.normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "")
  .replace(/ß/g, "ss")
  .toLocaleLowerCase();
const gate = document.getElementById("gate");
const app = document.getElementById("app");
const keyInput = document.getElementById("key");
const wordInput = document.getElementById("word");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
const lines = VOCAB.split(/\r?\n/);

function enter() {
  if (keyInput.value === "708") {
    gate.style.display = "none";
    app.style.display = "block";
    wordInput.focus();
  } else {
    document.getElementById("gateError").textContent = "入場キーが違います。";
    keyInput.select();
  }
}
document.getElementById("enter").addEventListener("click", enter);
keyInput.addEventListener("keydown", e => { if (e.key === "Enter") enter(); });

function search() {
  const q = wordInput.value.trim();
  if (!q) {
    statusEl.textContent = "検索する単語を入力してください。";
    resultsEl.textContent = "単語を入力してください。";
    wordInput.focus();
    return;
  }
  const nq = normalize(q);
  const hits = lines.map((line, i) => ({line, i}))
    .filter(x => normalize(x.line).includes(nq));
  if (hits.length) {
    statusEl.textContent = `見つかりました：${hits.length} 行に一致`;
    resultsEl.textContent = hits.map(x => `行 ${x.i + 1}: ${x.line}`).join("\n\n");
  } else {
    statusEl.textContent = "リスト内に見つかりませんでした。";
    resultsEl.textContent = `「${q}」に一致する箇所はありません。\nアクセント記号を付けずに入力しても検索できます。`;
  }
}
document.getElementById("search").addEventListener("click", search);
wordInput.addEventListener("keydown", e => { if (e.key === "Enter") search(); });
document.getElementById("clear").addEventListener("click", () => {
  wordInput.value = "";
  statusEl.textContent = "単語を入力してください。";
  resultsEl.textContent = "検索結果がここに表示されます。";
  wordInput.focus();
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f" && app.style.display !== "none") {
    e.preventDefault();
    wordInput.focus();
    wordInput.select();
  }
});
document.getElementById("toggleList").addEventListener("click", () => {
  const panel = document.getElementById("allList");
  const opening = panel.style.display !== "block";
  panel.style.display = opening ? "block" : "none";
  document.getElementById("toggleList").textContent = opening ? "リストを閉じる" : "リストをすべて表示";
  if (opening) document.getElementById("listText").textContent = VOCAB;
});
